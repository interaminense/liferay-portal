assemble:
    -   from: batch
        into: batch
analytics-cloud-charts-batch:
    name: Analytics Cloud Charts Batch
    oAuthApplicationHeadlessServer: analytics-cloud-charts-batch-oahs
    type: batch
analytics-cloud-charts-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Analytics Cloud Charts Batch OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer

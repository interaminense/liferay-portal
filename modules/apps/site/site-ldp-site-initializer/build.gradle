import com.liferay.gradle.plugins.node.task.YarnInstallTask

task ldpYarnInstall(type: YarnInstallTask)
task ldpYarnWebpack(type: Exec)

node {
	global = false
	nodeVersion = "18.18.0"
	useNpm = false
	yarnVersion = "1.22.19"
}

ldpYarnInstall {
	doLast {
		delete ".yarnrc"
	}

	workingDir = projectDir
}

ldpYarnWebpack {
	args = [ldpYarnInstall.scriptFile, "webpack"]
	dependsOn ldpYarnInstall
	executable = new File(ldpYarnInstall.nodeDir, "bin/node")
	workingDir = projectDir
}

packageRunWebpack {
	enabled = false
}

processResources {
	dependsOn ldpYarnWebpack
}

dependencies {
	compileOnly group: "com.liferay", name: "com.liferay.petra.concurrent", version: "default"
	compileOnly group: "com.liferay", name: "com.liferay.petra.function", version: "default"
	compileOnly group: "com.liferay", name: "com.liferay.petra.io", version: "default"
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang", version: "default"
	compileOnly group: "com.liferay", name: "com.liferay.petra.reflect", version: "default"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string", version: "default"
	compileOnly group: "com.liferay.jakarta.portlet", name: "com.liferay.jakarta.portlet-api", version: "4.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.taglib", version: "default"
	compileOnly group: "jakarta.servlet", name: "jakarta.servlet-api", version: "6.0.0"
	compileOnly group: "jakarta.servlet.jsp", name: "jakarta.servlet.jsp-api", version: "3.1.1"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.4.0"
	compileOnly project(":apps:frontend-taglib:frontend-taglib-react")
}
